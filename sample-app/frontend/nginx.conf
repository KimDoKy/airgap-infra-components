# 프론트엔드 정적 서빙 + /api/ 는 같은 네임스페이스의 backend 서비스로 프록시.
# 서비스명은 env 무관(네임스페이스로 분리)하게 acme-app-backend 로 고정.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://acme-app-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
