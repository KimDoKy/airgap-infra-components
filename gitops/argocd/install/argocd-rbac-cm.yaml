# ArgoCD RBAC — env별 sync 권한 분리.
#   developer: dev/test 만 sync (prd 불가)
#   release-manager: prd 포함 전 env sync
#   policy.default=role:readonly → 미지정 사용자는 읽기만(sync 불가)
# 계정(developer/releasemgr)은 argocd-cm 의 accounts.<name>: "apiKey,login" 로 생성하고,
# 비밀번호는 설치 후 설정: `argocd account update-password --account <name> ...`
#   (또는 API: PUT /api/v1/account/password, admin 이 대상 계정 비번 설정)
# nks/scripts/04 는 argo-cd helm 의 configs.rbac/configs.cm 로 동일 내용을 적용한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  policy.default: role:readonly
  scopes: '[groups]'
  policy.csv: |
    p, role:developer, applications, get, */*, allow
    p, role:developer, applications, sync, acme-dev/*, allow
    p, role:developer, applications, sync, acme-test/*, allow
    p, role:release-manager, applications, get, */*, allow
    p, role:release-manager, applications, sync, acme-dev/*, allow
    p, role:release-manager, applications, sync, acme-test/*, allow
    p, role:release-manager, applications, sync, acme-prd/*, allow
    g, developer, role:developer
    g, releasemgr, role:release-manager
