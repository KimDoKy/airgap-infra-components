# Nexus 앞단 TLS 종료 리버스 프록시
# 아티팩트 업로드/다운로드가 크고 오래 걸릴 수 있어 body size/timeout을 넉넉히 잡습니다.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 1g;

    # Docker 내장 DNS로 매 요청마다 재해석 - 백엔드 컨테이너가 재생성되어 IP가
    # 바뀌어도(예: 이미지 업그레이드) nginx를 재시작하지 않고 자동으로 따라감
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_nexus http://nexus:8081;
        proxy_pass $upstream_nexus;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
