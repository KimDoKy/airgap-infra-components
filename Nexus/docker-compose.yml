services:
  nexus:
    image: ${NEXUS_IMAGE}
    container_name: nexus
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - INSTALL4J_ADD_VM_PARAMS=-Xms${NEXUS_MIN_HEAP} -Xmx${NEXUS_MAX_HEAP} -XX:MaxDirectMemorySize=2g
    volumes:
      - ./nexus-data:/nexus-data
    # HTTP(8081)는 호스트에 노출하지 않음 - nginx 컨테이너를 통해서만 접근 (TLS 종료)

  nginx:
    image: ${NGINX_IMAGE}
    container_name: nexus-nginx
    restart: unless-stopped
    depends_on:
      - nexus
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "${TLS_PORT}:443"
      - "${TLS_HTTP_PORT}:80"
