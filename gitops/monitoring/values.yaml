# 플랫폼(모니터링)은 **taint 된 ops 전용 노드**에 배치: nodeSelector env=ops + toleration env=ops:NoSchedule.
#   ops 노드는 env=ops:NoSchedule taint → 플랫폼/시스템(ops toleration 보유)만 스케줄, 앱(dev/test/prd)은 배제.
# (Grafana ingress/root_url 은 nks/scripts/06-expose-monitoring.sh 가 LB_IP 확정 후 붙인다.)
alertmanager:
  enabled: false
prometheusOperator:
  nodeSelector: { env: ops }
  tolerations: [ { key: env, value: ops, effect: NoSchedule } ]
  admissionWebhooks:
    patch:
      nodeSelector: { env: ops }
      tolerations: [ { key: env, value: ops, effect: NoSchedule } ]
prometheus:
  prometheusSpec:
    nodeSelector: { env: ops }
    tolerations: [ { key: env, value: ops, effect: NoSchedule } ]
    retention: 2d
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1200Mi }
grafana:
  nodeSelector: { env: ops }
  tolerations: [ { key: env, value: ops, effect: NoSchedule } ]
  adminPassword: "<GRAFANA_PW>"
  service: { type: ClusterIP }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }
kube-state-metrics:
  nodeSelector: { env: ops }
  tolerations: [ { key: env, value: ops, effect: NoSchedule } ]
prometheus-node-exporter:
  tolerations:
    - operator: Exists   # DaemonSet: dev/test/prd/ops 전 노드 커버(모든 taint tolerate)
