# ArgoCD 가 GitOps repo(Gitea)를 읽을 자격 — **HTTPS + self-signed(insecure)**.
#   NKS→Gitea 는 git-SSH 2222 도달 불가 → HTTPS 443 사용(SG: NKS 노드 CIDR → gitea:443).
# 비번/토큰은 평문 커밋 금지 — kubectl 로 주입 권장:
#   kubectl -n argocd create secret generic acme-gitops-repo \
#     --from-literal=type=git --from-literal=url=https://<GITEA_IP>/admin/acme-gitops.git \
#     --from-literal=username=<GITEA_USER> --from-literal=password=<GITEA_TOKEN> \
#     --from-literal=insecure=true
#   kubectl -n argocd label secret acme-gitops-repo argocd.argoproj.io/secret-type=repository
apiVersion: v1
kind: Secret
metadata:
  name: acme-gitops-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://<GITEA_IP>/admin/acme-gitops.git
  username: <GITEA_USER>
  password: <GITEA_TOKEN>
  insecure: "true"        # Gitea 자체서명 인증서 우회(사설/테스트). 운영은 사설 CA 신뢰 권장.
