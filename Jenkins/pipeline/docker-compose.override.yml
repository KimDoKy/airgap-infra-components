# Jenkins 를 (1) 호스트 docker 사용(DooD), (2) JCasC 코드설정 적용 하도록 확장하는 오버라이드.
# 사용: Jenkins/ 루트에 복사 → cp pipeline/docker-compose.override.yml docker-compose.override.yml
#       후 docker compose up -d (base docker-compose.yml 과 병합).
# 주의: host docker.sock 접근 = 사실상 host root. cicd 는 폐쇄망 단일용도라 허용.
# 비밀값(NEXUS_CI_PASSWORD/GITEA_SSH_PRIVATE_KEY)은 파일 평문 대신 셸 env 로 주입:
#   export NEXUS_CI_PASSWORD=... GITEA_SSH_PRIVATE_KEY="$(cat key)" ; docker compose up -d
services:
  jenkins:
    group_add:
      - "999"                       # host docker 그룹 GID (getent group docker 로 확인 후 조정)
    environment:
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc/jenkins.yaml
      - NEXUS_CI_USER=${NEXUS_CI_USER:-ci}
      - NEXUS_CI_PASSWORD=${NEXUS_CI_PASSWORD:-}
      - GITEA_SSH_PRIVATE_KEY=${GITEA_SSH_PRIVATE_KEY:-}
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./pipeline/jcasc:/var/jenkins_home/casc:ro
