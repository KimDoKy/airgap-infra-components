# 플랫폼(모니터링)은 ops 노드에 배치(nodeSelector env=ops). ops 는 taint 없음 → toleration 불필요.
# taint 는 앱(dev/test/prd) 격리 전용이므로 플랫폼은 taint 메커니즘과 무관.
# (Grafana ingress/root_url 은 nks/scripts/06-expose-monitoring.sh 가 LB_IP 확정 후 붙인다.)
alertmanager:
  enabled: false
prometheusOperator:
  nodeSelector: { env: ops }
  admissionWebhooks:
    patch:
      nodeSelector: { env: ops }
prometheus:
  prometheusSpec:
    nodeSelector: { env: ops }
    retention: 2d
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1200Mi }
grafana:
  nodeSelector: { env: ops }
  adminPassword: "<GRAFANA_PW>"
  service: { type: ClusterIP }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }
kube-state-metrics:
  nodeSelector: { env: ops }
prometheus-node-exporter:
  tolerations:
    - operator: Exists   # DaemonSet: dev/test/prd taint 노드까지 전 노드 커버
