# Jenkins 앞단 TLS 종료 리버스 프록시
# Jenkins는 실시간 로그 스트리밍에 롱폴링/웹소켓을 사용하므로 관련 지시자를 포함합니다.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 200m;

    # Docker 내장 DNS로 매 요청마다 재해석 - 백엔드 컨테이너가 재생성되어 IP가
    # 바뀌어도(예: 이미지 업그레이드) nginx를 재시작하지 않고 자동으로 따라감
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_jenkins http://jenkins:8080;
        proxy_pass $upstream_jenkins;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http:// https://;

        # 웹소켓 업그레이드 / 롱폴링 지원
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
