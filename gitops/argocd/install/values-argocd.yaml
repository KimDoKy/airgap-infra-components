# argo-cd Helm 차트 values (NKS 설치용). 차트: argo/argo-cd
# NKS 는 인터넷 egress 로 ArgoCD 컴포넌트 이미지(argocd/redis/dex)를 공개 레지스트리에서 직접 pull
#   → 별도 미러/override 불필요. (앱 이미지는 NCR — 네임스페이스의 ncr-cred imagePullSecret 으로 pull.)
global:
  nodeSelector: { env: ops }        # 플랫폼 노드(taint 없음)에 배치
configs:
  params:
    server.insecure: true           # Ingress 에서 TLS 종료(nks/scripts/07-expose-argocd.sh)
# RBAC/계정은 argocd-rbac-cm.yaml + argocd-cm(accounts) 참고. prd 는 수동 Sync(releasemgr).
