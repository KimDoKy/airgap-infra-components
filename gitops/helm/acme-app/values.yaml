# 공통 기본값 — 환경별 차이는 values-<env>.yaml 로 오버라이드.
# ArgoCD Application 이 이 차트 + values-<env>.yaml 로 렌더링해 EKS 에 동기화.
# Jenkins(CI)는 여기의 components.*.image.tag 를 커밋으로 갱신 → ArgoCD 가 감지·배포.

envName: dev
namespace: acme-app-dev
nodeEnvLabelKey: env            # 노드 label/taint 키 (물리 분리)

# 두 컴포넌트를 한 릴리스로 렌더링
components:
  frontend:
    image:
      repository: "<AWS_ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com/acme-app-frontend"
      tag: "latest"             # CI 가 갱신
    containerPort: 80
    servicePort: 80
    replicaCount: 1
    healthPath: "/"
    env: []
    resources:
      requests: { cpu: "50m",  memory: "64Mi" }
      limits:   { cpu: "250m", memory: "256Mi" }
  backend:
    image:
      repository: "<AWS_ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com/acme-app-backend"
      tag: "latest"
    containerPort: 3000
    servicePort: 3000
    replicaCount: 1
    healthPath: "/api/health"
    env:
      - { name: APP_ENV, value: "dev" }
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits:   { cpu: "500m", memory: "512Mi" }

imagePullPolicy: IfNotPresent
imagePullSecrets: []             # ECR pull 을 IRSA/노드역할로 하면 비워둠
