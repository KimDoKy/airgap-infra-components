# ArgoCD 가 GitOps repo(Gitea, git-SSH 2222)를 읽을 자격. SSH read-only 배포키 권장.
# sshPrivateKey 는 실제 키로 채우세요(평문 커밋 금지 — 클러스터에 kubectl create secret 로 주입 권장).
#   kubectl -n argocd create secret generic acme-gitops-repo \
#     --from-literal=type=git \
#     --from-literal=url=ssh://git@<GITEA_IP>:2222/acme/acme-gitops.git \
#     --from-file=sshPrivateKey=./argocd_gitops_key
#   kubectl -n argocd label secret acme-gitops-repo argocd.argoproj.io/secret-type=repository
apiVersion: v1
kind: Secret
metadata:
  name: acme-gitops-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: ssh://git@<GITEA_IP>:2222/acme/acme-gitops.git
  sshPrivateKey: |
    <ARGOCD_GITOPS_READONLY_SSH_PRIVATE_KEY>
