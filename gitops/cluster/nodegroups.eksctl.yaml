# 환경별 노드 분리 — **권장: 노드그룹 정의에 label+taint 선언**(노드 교체/오토스케일에도 자동 유지).
#   kubectl taint <node> 는 명령형이라 노드가 바뀌면 사라짐 → 아래처럼 managed nodegroup 에 박는 게 정석.
# 적용: eksctl create nodegroup -f nodegroups.eksctl.yaml  (또는 Terraform aws_eks_node_group 의 labels/taints)
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: acme-eks
  region: ap-northeast-2
managedNodeGroups:
  - name: acme-eks-dev
    instanceType: t3.medium
    minSize: 1
    desiredCapacity: 2
    maxSize: 3
    labels: { env: dev }              # helm nodeSelector(env=dev) 매칭
    taints:
      - { key: env, value: dev, effect: NoSchedule }   # 다른 env pod 배제
  - name: acme-eks-stg
    instanceType: t3.medium
    minSize: 1
    desiredCapacity: 2
    maxSize: 3
    labels: { env: stg }
    taints:
      - { key: env, value: stg, effect: NoSchedule }
  - name: acme-eks-prd
    instanceType: t3.large
    minSize: 2
    desiredCapacity: 3
    maxSize: 5
    labels: { env: prd }
    taints:
      - { key: env, value: prd, effect: NoSchedule }
